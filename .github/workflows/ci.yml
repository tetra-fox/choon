name: ci

on:
  push:
    branches: [main]
  pull_request:

# the job runs every dependency's code, so it gets a read-only token
permissions:
  contents: read

# a newer push to a pull request replaces its run; on main each commit keeps its own result
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix develop -c just ci
