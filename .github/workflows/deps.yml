# turns on github's auto-merge for a dependabot cargo pull request, which then merges once the
# checks the branch ruleset requires (ci.yml) pass. no pull request code runs here. action and
# flake input bumps are left for review, since an action's code and the flake's toolchain run
# where publish.yml holds the crates.io token
name: deps

on: pull_request

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.actor == 'dependabot[bot]'
      && startsWith(github.head_ref, 'dependabot/cargo/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3.15.0
        with:
          use-github-auto-merge: true
          target: minor
