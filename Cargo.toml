[package]
name = "choon"
description = "Judges from its spectrum whether an audio file is what its format claims, such as a FLAC made from an MP3"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
repository = "https://github.com/tetra-fox/choon"
readme = "README.md"
keywords = ["audio", "flac", "lossless", "transcode", "spectrum"]
categories = ["multimedia::audio", "command-line-utilities"]
include = ["/src/", "/README.md", "/LICENSE"]

[features]
default = ["cli"]
# the `choon` program; a library user turns default features off and builds none of it
cli = ["dep:clap", "dep:serde_json"]
# the generated audio and the sample file the analyzer is tested on, for the program's tests here
# and the tests of the crates that use this one
testing = ["dep:flacenc", "dep:mp3lame-encoder"]

[[bin]]
name = "choon"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
realfft = "3.5.1"
# the half-length complex transform of the codec grid scan's DCT-IV
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
# decodes every audio format the analyzer reads, streamed
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-common = "0.6.1"
tracing = "0.1.44"

clap = { version = "4.6.7", features = ["derive"], optional = true }
# a float written and read back is the same float, to its last digit
serde_json = { version = "1.0.154", features = ["float_roundtrip"], optional = true }

# make the lossless and lossy audio the analyzer is tested on. mp3lame-encoder builds the LAME
# source it carries with autotools (`configure`, `make`, a C compiler)
flacenc = { version = "0.5.1", default-features = false, optional = true }
mp3lame-encoder = { version = "0.3.0", optional = true }

[dev-dependencies]
# the crate itself with `testing`, for the generated audio its tests read
choon = { path = ".", features = ["testing"] }
proptest = "1.12.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tempfile = "3.27.0"

[[test]]
name = "cli"
required-features = ["cli"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# the transforms and decoders are slow unoptimized; tests analyze audio
[profile.dev.package.choon]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-bundle-flac]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

# the encoders the tests make audio with
[profile.dev.package.flacenc]
opt-level = 3

[profile.dev.package.mp3lame-sys]
opt-level = 3
